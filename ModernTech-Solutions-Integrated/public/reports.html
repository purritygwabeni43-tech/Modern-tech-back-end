
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ModernTech | Reports</title>
  <link rel="stylesheet" href="dashboard.css">
  <link rel="stylesheet" href="css/sidebar.css">
  <link rel="stylesheet" href="css/reports.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-brand"><div class="brand-logo">MT</div><div><h2>ModernTech</h2><span>HR CENTRAL PORTAL</span></div></div>
      <nav class="navigation">
        <a href="dashboard.html" class="nav-item"><i class="fa-solid fa-chart-pie"></i><span>Dashboard</span></a>
        <a href="attendance.html" class="nav-item"><i class="fa-solid fa-calendar-check"></i><span>Attendance</span></a>
        <a href="leave.html" class="nav-item"><i class="fa-solid fa-plane-departure"></i><span>Leave</span></a>
        <a href="employees.html" class="nav-item"><i class="fa-solid fa-users"></i><span>Employees</span></a>
        <a href="payroll.html" class="nav-item"><i class="fa-solid fa-wallet"></i><span>Payslips</span></a>
        <a href="reports.html" class="nav-item active"><i class="fa-solid fa-file-invoice"></i><span>Reports</span></a>
      </nav>
      <div class="sidebar-account"><a href="login.html"><i class="fa-solid fa-right-to-bracket"></i><span>Login</span></a><button type="button" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i><span>Log Out</span></button></div>
    </aside>
    <main class="main-content">
      <header class="topbar"><div><p class="eyebrow">People & operations overview</p><h1>Performance ratings</h1><p class="dashboard-copy">Employee review scores and feedback from the database.</p></div></header>
      <section class="content-grid" style="grid-template-columns:1fr">
        <article class="card">
          <div class="card-head"><div><p class="small-label">Performance</p><h4 id="reviewFormTitle">Add employee review</h4></div></div>
          <form id="reviewForm" class="review-form"><input type="hidden" id="reviewId"><label>Employee<select id="reviewEmployee" required></select></label><label>Review date<input id="reviewDate" type="date" required></label><label>Score<input id="reviewScore" type="number" min="1" max="5" step="0.1" required></label><label>Reviewer<input id="reviewer" maxlength="100"></label><label>Feedback<textarea id="reviewFeedback"></textarea></label><div><button class="primary-btn" type="submit">Save review</button><button class="secondary-btn" id="cancelReview" type="button" hidden>Cancel edit</button></div></form>
          <div class="review-list" id="reviews"><p>Loading...</p></div>
        </article>
      </section>
    </main>
  </div>
  <script src="auth.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/reports.js"></script>
</body>
</html>
