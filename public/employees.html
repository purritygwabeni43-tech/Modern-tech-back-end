<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ModernTech - HR Central Portal</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <div class="app-layout">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="brand">
                <img src="images/logo.png" alt="Logo" class="brand-logo" onerror="this.style.display='none'">
                <div class="brand-text">
                    <h2>ModernTech</h2>
                    <p>HR Central Portal</p>
                </div>
            </div>

            <nav class="nav-menu">
                <a href="#" class="nav-item"><span class="icon">📊</span><span>Dashboard</span></a>
                <a href="#" class="nav-item"><span class="icon">📅</span><span>Attendance</span></a>
                <a href="#" class="nav-item active"><span class="icon">👥</span><span>Employees</span></a>
                <a href="#" class="nav-item"><span class="icon">💳</span><span>Payslips</span></a>
            </nav>
        </aside>

        <!-- Main Workspace -->
        <main class="main-content">
            <header class="content-header">
                <div class="header-titles">
                    <h1>Employee Information Directory</h1>
                    <p>Centralized profile registry mapped from system data channels.</p>
                </div>
                <button id="open-add-modal-btn" class="btn-primary">+ Add New Employee</button>
            </header>

            <!-- Search Bar -->
            <div class="search-container">
                <input type="text" id="search-input" placeholder="🔍 Search employees by name, job position, or email...">
            </div>

            <!-- Dynamic Card Grid -->
            <div id="employee-container" class="employee-grid">
                <p style="color: var(--text-secondary);">Loading employees...</p>
            </div>
        </main>
    </div>

    <!-- Add / Edit Employee Modal -->
    <div id="employee-modal" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-header">
                <h2 id="modal-title">Add New Employee</h2>
                <button id="close-modal-btn" class="close-btn">&times;</button>
            </div>
            
            <form id="employee-form">
                <input type="hidden" id="emp-id">
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="first-name">First Name</label>
                        <input type="text" id="first-name" placeholder="e.g. Sipho" required>
                    </div>
                    <div class="form-group">
                        <label for="last-name">Last Name</label>
                        <input type="text" id="last-name" placeholder="e.g. Dlamini" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="emp-email">Email</label>
                        <input type="email" id="emp-email" placeholder="sipho@moderntech.com">
                    </div>
                    <div class="form-group">
                        <label for="emp-phone">Phone Number</label>
                        <input type="text" id="emp-phone" placeholder="0821234567">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="emp-position">Position</label>
                        <input type="text" id="emp-position" placeholder="e.g. Developer" required>
                    </div>
                    <div class="form-group">
                        <label for="emp-department">Department ID</label>
                        <input type="number" id="emp-department" value="1" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="emp-salary">Salary (ZAR)</label>
                        <input type="number" id="emp-salary" placeholder="50000" required>
                    </div>
                    <div class="form-group">
                        <label for="hire-date">Hire Date</label>
                        <input type="date" id="hire-date">
                    </div>
                </div>

                <div class="modal-actions">
                    <button type="button" id="cancel-btn" class="btn-secondary">Cancel</button>
                    <button type="submit" class="btn-primary">Save Employee</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Employee Details Modal -->
    <div id="details-modal" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-header">
                <h2>Employee Details</h2>
                <button id="close-details-btn" class="close-btn">&times;</button>
            </div>
            <div id="details-body" class="details-content"></div>
        </div>
    </div>

    <script src="js/employees.js"></script>
</body>
</html>
